apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ⚠️ Sync SAU monitoring-extras (-10) vì cần StorageClass + Secret
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  # CRDs to ignore (Helm + Operator hay tạo lệch diff)
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 62.7.0 # ⚠️ pin version cho reproducibility
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # ─── Prometheus ────────────────────────────
        prometheus:
          prometheusSpec:
            # Retention: 15 ngày cho dev (tradeoff storage/history)
            retention: 15d
            retentionSize: "8GB"
            # Discover ServiceMonitor từ tất cả namespace
            # Mặc định nó CHỈ match release label → false sẽ catch mọi SM
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # Storage
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            # Resources
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 2Gi
            # Scrape config defaults
            scrapeInterval: 30s # Dev: 30s tiết kiệm. Prod: 15s
            evaluationInterval: 30s
        # ─── Alertmanager ──────────────────────────
        # Sẽ config chi tiết ở Lesson 7.5
        alertmanager:
          enabled: true
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
        # ─── Grafana ───────────────────────────────
        # Sẽ config chi tiết ở Lesson 7.3
        grafana:
          enabled: true
          # ─── Admin credentials từ ExternalSecret ────────
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          # ─── Persistence ────────────────────────────────
          persistence:
            enabled: true
            storageClassName: gp3
            size: 2Gi
          deploymentStrategy:
            type: Recreate
          # ─── Ingress qua ALB ────────────────────────────
          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
              alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-southeast-1:954692413669:certificate/259c4af3-e877-45f7-a1b1-a9c4a351a7ed"
              alb.ingress.kubernetes.io/ssl-redirect: '443'
              alb.ingress.kubernetes.io/healthcheck-path: /api/health
              alb.ingress.kubernetes.io/group.name: monitoring
            hosts:
              - grafana.vantai.click
            paths:
              - /
          # ─── Grafana config ─────────────────────────────
          grafana.ini:
            server:
              root_url: "https://grafana.vantai.click"
              serve_from_sub_path: false
            auth.anonymous:
              enabled: false
            security:
              cookie_secure: true
              cookie_samesite: lax
              disable_gravatar: true
          # ─── Sidecar config (CRITICAL cho dashboard-as-code) ────
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL # scan TẤT CẢ namespaces
              folder: /tmp/dashboards
              provider:
                foldersFromFilesStructure: false
            datasources:
              enabled: true
              label: grafana_datasource
              labelValue: "1"
        # ─── kube-state-metrics ────────────────────
        kube-state-metrics:
          enabled: true
        # ─── node-exporter ─────────────────────────
        nodeExporter:
          enabled: true
        # ─── prometheus-operator ───────────────────
        prometheusOperator:
          enabled: true
          # Admission webhook đôi khi gây vấn đề khi ArgoCD sync
          admissionWebhooks:
            patch:
              enabled: true
        # ─── Default rules ─────────────────────────
        # Tắt 1 vài rule không cần cho dev
        defaultRules:
          create: true
          rules:
            etcd: false # EKS managed → không expose etcd
            kubeApiserverAvailability: true
            kubeControllerManager: false # EKS managed
            kubeScheduler: false # EKS managed
            kubeProxy: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRDs install lần đầu
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
