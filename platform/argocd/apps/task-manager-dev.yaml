# platform/argocd/apps/task-manager-dev.yaml
#
# ArgoCD Application using Helm chart.
# Version 2: Fixed dependency hell with proper ignoreDifferences + retry logic.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Devop-Projects/nt548-config.git
    targetRevision: main
    path: charts/task-manager
    helm:
      releaseName: task-manager
      valueFiles:
        - values.yaml
        - values-aws-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager-dev

  # ⭐ ignoreDifferences: tránh false-positive drift detection
  ignoreDifferences:
    # K8s injects pod-template-hash, controller-uid sau khi tạo
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      jqPathExpressions:
        - '.spec.selector["rollouts-pod-template-hash"]'
    - group: apps
      kind: ReplicaSet
      jqPathExpressions:
        - '.metadata.labels["rollouts-pod-template-hash"]'
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
    # ⭐ Job: K8s auto-add controller-uid label sau khi tạo → drift false-positive
    - group: batch
      kind: Job
      jqPathExpressions:
        - '.spec.template.metadata.labels["controller-uid"]'
        - '.spec.template.metadata.labels["batch.kubernetes.io/controller-uid"]'
        - '.spec.template.metadata.labels["job-name"]'
        - '.spec.template.metadata.labels["batch.kubernetes.io/job-name"]'
        - '.spec.selector.matchLabels["controller-uid"]'
        - '.spec.selector.matchLabels["batch.kubernetes.io/controller-uid"]'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    # ⭐ Retry generous hơn: 5 attempts với exponential backoff
    # Lần đầu deploy có thể fail vì ESO chưa sync xong → ArgoCD tự retry
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10