# platform/argocd/apps/task-manager-dev.yaml
#
# ArgoCD Application using Helm chart.
# Migrated from Kustomize on $(date +%Y-%m-%d).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Devop-Projects/nt548-config.git
    targetRevision: main
    # ⭐ Trỏ vào folder chứa Chart.yaml (không phải overlay nữa)
    path: charts/task-manager

    # ⭐ Helm-specific config
    helm:
      releaseName: task-manager
      valueFiles:
        - values.yaml             # Base defaults
        - values-aws-dev.yaml     # Environment overrides

      # Optional: override values inline (use sparingly)
      # parameters:
      #   - name: backend.image.tag
      #     value: "abc123"

  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      # Helm hooks → ArgoCD PreSync/PostSync
      # ArgoCD tự handle, không cần option đặc biệt
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    
    - group: ""
      kind: Service
      jqPathExpressions:
        - '.spec.selector["rollouts-pod-template-hash"]'
    - group: apps
      kind: ReplicaSet
      jqPathExpressions:
        - '.metadata.labels["rollouts-pod-template-hash"]'
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
  
