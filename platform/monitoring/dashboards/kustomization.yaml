apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# ⭐ MAGIC LABEL — Grafana sidecar scan ConfigMap có label này
# Match với config sidecar.dashboards.label trong kube-prometheus-stack values
labels:
  - pairs:
      grafana_dashboard: "1"
    includeSelectors: false

commonAnnotations:
  managed-by: gitops
  thesis.author: vantai-NT548

# ⭐ ConfigMap generator từ JSON file
# Kustomize tự đọc file → tạo ConfigMap với content là file content
configMapGenerator:
  - name: backend-red-dashboard
    files:
      - backend-red.json

generatorOptions:
  # Hash suffix: khi JSON đổi → name đổi (vd: backend-red-dashboard-h7f2k9)
  # → Grafana sidecar thấy "ConfigMap mới" → reload dashboard
  disableNameSuffixHash: false
