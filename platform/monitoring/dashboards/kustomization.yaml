apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# Apply label to MỌI resource
labels:
- pairs:
    grafana_dashboard: "1"      # ⭐ Magic label cho sidecar
  includeSelectors: false

# Common annotations
commonAnnotations:
  managed-by: gitops

# Configmap generator từ JSON files
configMapGenerator:
- name: backend-red-dashboard
  files:
  - backend-red.json
- name: node-use-dashboard
  files:
  - node-use.json