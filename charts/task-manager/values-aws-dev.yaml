# values-aws-dev.yaml — AWS dev environment
#
# Differs from values-dev.yaml:
# - RDS (postgres.enabled=false)
# - External Secrets (JWT + DB password from AWS Secrets Manager)
# - AWS ALB Ingress

global:
  environment: dev
  cloud: aws
namespace:
  create: true
  name: task-manager-dev
backend:
  replicaCount: 2
  image:
    repository: doanvantai/nt548-backend
    tag: "ec76318" # CI sẽ update
  config:
    LOG_LEVEL: info
    # ⚠️ Update theo RDS endpoint thực tế:
    DB_HOST: "devops-dev-db.chi0awig8v33.ap-southeast-1.rds.amazonaws.com"
    DB_PORT: "5432"
    DB_NAME: "appdb"
    DB_USER: "appuser"
    DB_SSL: "true"
  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStoreName: aws-secrets-manager
    awsSecretName: "devops/dev/backend/secrets"
    # ⚠️ Update theo RDS secret thực tế:
    dbSecretName: "rds!db-987c0441-43a9-4fd5-9856-644e7ce79d2b"
  rollout:
    enabled: true
    strategy: blueGreen
    blueGreen:
      activeService: backend
      previewService: backend-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        enabled: false
        templates: []
      postPromotionAnalysis:
        enabled: false
        templates: []
frontend:
  replicaCount: 2
  image:
    repository: doanvantai/nt548-frontend
    tag: "ec76318"
# Tắt postgres in-cluster (dùng RDS thay)
postgres:
  enabled: false
ingress:
  enabled: true
  className: alb
  alb:
    # ⚠️ Update theo ACM cert thực tế:
    certificateArn: "arn:aws:acm:ap-southeast-1:954692413669:certificate/159a84b7-9e3a-4e50-90bd-966a4d4a1390"
    healthcheckPath: /health/ready
  hosts:
    - host: task-manager.vantai.click
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
  tls:
    enabled: false # ALB handle TLS via certArn, không cần K8s TLS secret
networkPolicies:
  enabled: true
  ingressControllerNamespace: ingress-nginx # Adjust nếu cần
autoscaling:
  enabled: false # Dev không cần HPA
podDisruptionBudget:
  enabled: false
