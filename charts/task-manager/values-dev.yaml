# values-dev.yaml — Local dev environment (kind cluster)
#
# Overrides values.yaml defaults cho dev:
# - 1 replica (tiết kiệm tài nguyên)
# - In-cluster postgres
# - LOG_LEVEL=debug
# - Nginx Ingress

global:
  environment: dev
  cloud: local

namespace:
  create: true
  name: task-manager-dev

monitoring:
  enabled: true
  scrapeInterval: 30s

backend:
  replicaCount: 1
  image:
    tag: "v0.1.3"
  config:
    LOG_LEVEL: debug
    DB_HOST: postgres
    DB_NAME: taskdb
    DB_USER: taskuser
    DB_SSL: "false"
  externalSecret:
    enabled: false

frontend:
  replicaCount: 1
  image:
    tag: "v0.1.0"

postgres:
  enabled: true
  auth:
    database: taskdb
    username: taskuser
    password: "taskpassword-strong"   # Override in real dev

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: taskmanager.local
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
