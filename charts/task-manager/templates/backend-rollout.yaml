{{/*
═══════════════════════════════════════════════════════════════════
templates/backend-rollout.yaml

Argo Rollouts Rollout CRD — drop-in replacement cho Deployment.
Chỉ render khi backend.rollout.enabled = true.

Structure y hệt Deployment, chỉ khác:
- kind: Rollout
- spec.strategy: blueGreen | canary
═══════════════════════════════════════════════════════════════════
*/}}
{{- if and .Values.backend.enabled .Values.backend.rollout.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "task-manager.backend.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "task-manager.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      {{- include "task-manager.backend.selectorLabels" . | nindent 6 }}

  # ─── STRATEGY ───
  strategy:
      {{- if eq .Values.backend.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ .Values.backend.rollout.blueGreen.activeService }}
      previewService: {{ .Values.backend.rollout.blueGreen.previewService }}
      autoPromotionEnabled: {{ .Values.backend.rollout.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.backend.rollout.blueGreen.scaleDownDelaySeconds }}

      # ⭐ Block prePromotionAnalysis
      {{- if .Values.backend.rollout.blueGreen.prePromotionAnalysis.enabled }}
      prePromotionAnalysis:
        templates:
          {{- range .Values.backend.rollout.blueGreen.prePromotionAnalysis.templates }}
          - templateName: {{ . }}
          {{- end }}
        # ⭐ ARGS — đây là chỗ Rollout truyền service name cho AnalysisTemplate
        args:
          - name: service-name
            value: {{ .Values.backend.rollout.blueGreen.previewService }}
      {{- end }}

      # postPromotionAnalysis — tương tự
      {{- if .Values.backend.rollout.blueGreen.postPromotionAnalysis.enabled }}
      postPromotionAnalysis:
        templates:
          {{- range .Values.backend.rollout.blueGreen.postPromotionAnalysis.templates }}
          - templateName: {{ . }}
          {{- end }}
        args:
          - name: service-name
            value: {{ .Values.backend.rollout.blueGreen.activeService }}
      {{- end }}
    {{- end }}

    {{- if eq .Values.backend.rollout.strategy "canary" }}
    canary:
      stableService: {{ .Values.backend.rollout.canary.stableService }}
      canaryService: {{ .Values.backend.rollout.canary.canaryService }}

      maxSurge: {{ .Values.backend.rollout.canary.maxSurge | quote }}
      maxUnavailable: {{ .Values.backend.rollout.canary.maxUnavailable }}
      scaleDownDelaySeconds: {{ .Values.backend.rollout.canary.scaleDownDelaySeconds }}

      {{- if .Values.backend.rollout.canary.analysis.enabled }}
      analysis:
        startingStep: {{ .Values.backend.rollout.canary.analysis.startingStep }}
        templates:
          {{- range .Values.backend.rollout.canary.analysis.templates }}
          - templateName: {{ . }}
          {{- end }}
        args:
          - name: service-name
            value: {{ .Values.backend.rollout.canary.canaryService }}
      {{- end }}

      steps:
        {{- toYaml .Values.backend.rollout.canary.steps | nindent 8 }}
    {{- end }}

  # ─── TEMPLATE — y hệt Deployment ───
  template:
    metadata:
      labels:
        {{- include "task-manager.backend.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap checksum — auto restart khi config đổi
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.backend.name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}

      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}

      containers:
      - name: backend
        image: {{ include "task-manager.backend.image" . }}
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        securityContext:
          {{- toYaml .Values.backend.containerSecurityContext | nindent 10 }}

        envFrom:
        - configMapRef:
            name: {{ include "task-manager.backend.fullname" . }}-config

        env:
        {{- if .Values.backend.externalSecret.enabled }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USERNAME
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_SECRET
        {{- else }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "task-manager.postgres.secretName" . }}
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_SECRET
        {{- end }}

        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}

        {{- if .Values.backend.probes.startup.enabled }}
        startupProbe:
          httpGet:
            path: {{ .Values.backend.probes.startup.path }}
            port: {{ .Values.backend.probes.startup.port }}
          periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
          failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
        {{- end }}

        {{- if .Values.backend.probes.liveness.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.backend.probes.liveness.path }}
            port: {{ .Values.backend.probes.liveness.port }}
          periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
        {{- end }}

        {{- if .Values.backend.probes.readiness.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.backend.probes.readiness.path }}
            port: {{ .Values.backend.probes.readiness.port }}
          periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
        {{- end }}

        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep {{ .Values.backend.preStopSleep }}"]

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
