{{/*
═══════════════════════════════════════════════════════════════════
templates/migrate-job.yaml

Database migration Job — runs schema migrations.

DESIGN DECISIONS:

1. NO Helm hook anymore.
   OLD: helm.sh/hook: pre-install,pre-upgrade
   PROBLEM: Hook forces Job to run BEFORE all other resources.
            Job started before ExternalSecret synced → CreateContainerConfigError
            → Job FAIL → ArgoCD sync FAIL
   NEW:    Use initContainers to wait for dependencies.
            Job runs concurrently with other resources, but blocks until ready.

2. Unique name per image tag.
   Job is immutable. Same name + spec change = 'field is immutable' error.
   Adding tag hash to name → each version has unique Job.

3. initContainers wait for:
   - Secret 'db-credentials' (ESO synced) — when externalSecret enabled
   - RDS endpoint reachable (TCP probe)

4. automountServiceAccountToken: true
   Trade-off: enable token mount on migrate Job (initContainer kubectl needs it).
   Acceptable: one-off Job, not long-running service.
═══════════════════════════════════════════════════════════════════
*/}}
{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  # ⭐ Tên unique theo image tag → mỗi version có Job riêng
  # `trunc 8` để tránh tên Job > 63 chars
  name: {{ include "task-manager.fullname" . }}-migrate-{{ .Values.backend.image.tag | toString | trunc 8 | replace "." "-" }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
    app: db-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  # Tăng deadline để có time cho initContainers wait
  activeDeadlineSeconds: 900

  template:
    metadata:
      labels:
        app: db-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.serviceAccounts.backend.name }}
      # ⚠️ Migrate cần kubectl token cho initContainer wait-for-secret
      # OK vì Job one-off (khác với long-running pods)
      automountServiceAccountToken: true

      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}

      # ════════════════════════════════════════════════════════════
      # INIT CONTAINERS: chờ dependencies trước khi chạy migrate
      # ════════════════════════════════════════════════════════════
      initContainers:
      {{- if .Values.backend.externalSecret.enabled }}
      # ─── Wait #1: ExternalSecret đã sync xong db-credentials ──
      # Block tối đa 600s (10 phút) — đủ cho ESO retry + AWS Secrets Manager
      - name: wait-for-db-credentials
        image: bitnami/kubectl:1.30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        command:
          - sh
          - -c
          - |
            set -e
            echo "[wait-for-db-credentials] Polling Secret 'db-credentials' in {{ .Values.namespace.name }}..."
            for i in $(seq 1 60); do
              if kubectl get secret db-credentials -n {{ .Values.namespace.name }} >/dev/null 2>&1; then
                # Secret tồn tại + có data field DB_PASSWORD
                if kubectl get secret db-credentials -n {{ .Values.namespace.name }} \
                     -o jsonpath='{.data.DB_PASSWORD}' 2>/dev/null | grep -q .; then
                  echo "[wait-for-db-credentials] ✓ Secret synced (attempt $i, ~$((i*10))s)"
                  exit 0
                fi
              fi
              echo "[wait-for-db-credentials] Attempt $i/60: not ready, sleep 10s"
              sleep 10
            done
            echo "[wait-for-db-credentials] ✗ TIMEOUT after 600s"
            echo "[wait-for-db-credentials] Diagnostics:"
            kubectl get externalsecret -n {{ .Values.namespace.name }} || true
            kubectl describe externalsecret db-credentials -n {{ .Values.namespace.name }} | tail -30 || true
            exit 1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      {{- end }}

      # ─── Wait #2: RDS endpoint reachable (TCP probe) ─────────
      - name: wait-for-rds
        image: busybox:1.36
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - configMapRef:
            name: {{ include "task-manager.backend.fullname" . }}-config
        command:
          - sh
          - -c
          - |
            echo "[wait-for-rds] Probing $DB_HOST:$DB_PORT..."
            for i in $(seq 1 30); do
              if nc -z -w 3 $DB_HOST $DB_PORT 2>/dev/null; then
                echo "[wait-for-rds] ✓ RDS reachable (attempt $i, ~$((i*10))s)"
                exit 0
              fi
              echo "[wait-for-rds] Attempt $i/30: not ready, sleep 10s"
              sleep 10
            done
            echo "[wait-for-rds] ✗ TIMEOUT after 300s"
            exit 1
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi

      # ════════════════════════════════════════════════════════════
      # MAIN CONTAINER: chạy migration sau khi initContainers OK
      # ════════════════════════════════════════════════════════════
      containers:
      - name: migrate
        image: {{ include "task-manager.backend.image" . }}
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        command: ["node", "src/scripts/migrate.js"]

        securityContext:
          {{- toYaml .Values.backend.containerSecurityContext | nindent 10 }}

        envFrom:
        - configMapRef:
            name: {{ include "task-manager.backend.fullname" . }}-config

        env:
        {{- if .Values.backend.externalSecret.enabled }}
        # AWS mode: từ ExternalSecret-synced K8s Secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USERNAME
        {{- else }}
        # Local mode: từ in-cluster Secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "task-manager.postgres.secretName" . }}
              key: POSTGRES_PASSWORD
        {{- end }}
        # Placeholder để config validator không fail
        # Migrate không dùng JWT thực sự
        - name: JWT_SECRET
          value: "migration-placeholder-not-used-but-required-by-validator-min-32-chars"

        resources:
          {{- toYaml .Values.migration.resources | nindent 10 }}

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}