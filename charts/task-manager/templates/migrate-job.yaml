{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "task-manager.fullname" . }}-migrate-{{ .Values.backend.image.tag | toString | trunc 8 | replace "." "-" }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
    app: db-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: db-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.serviceAccounts.backend.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
      - name: migrate
        image: {{ include "task-manager.backend.image" . }}
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        command: ["node", "src/scripts/migrate.js"]
        securityContext:
          {{- toYaml .Values.backend.containerSecurityContext | nindent 10 }}
        envFrom:
        - configMapRef:
            name: {{ include "task-manager.backend.fullname" . }}-config
        env:
        {{- if .Values.backend.externalSecret.enabled }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USERNAME
        {{- else }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "task-manager.postgres.secretName" . }}
              key: POSTGRES_PASSWORD
        {{- end }}
        - name: JWT_SECRET
          value: "migration-placeholder-not-used-but-required-by-validator-min-32"
        resources:
          {{- toYaml .Values.migration.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
